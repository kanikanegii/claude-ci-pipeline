name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Task for Claude to implement"
        required: true
        type: string

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          claude -p "$PROMPT" \
            --permission-mode acceptEdits \
            --allowedTools "Edit,Write,Read" \
            --disallowedTools "Bash"

      - name: Commit and open PR
        env:
          # Requires a PAT (repo scope) in secrets.PR_PAT, not the default GITHUB_TOKEN:
          # PRs opened with GITHUB_TOKEN don't trigger pull_request workflows, which would
          # silently skip the `review` job below.
          GH_TOKEN: ${{ secrets.PR_PAT }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          git config user.name "claude-bot"
          git config user.email "claude-bot@users.noreply.github.com"

          # Never let generation commit changes to the pipeline or its own rules,
          # regardless of what files the prompt caused Claude to touch.
          git add -A -- ':!.github' ':!.claude'

          if git diff --cached --quiet; then
            echo "No file changes produced by this prompt — nothing to commit."
            exit 0
          fi

          BRANCH="claude/generate-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "Generate: $PROMPT"
          git push -u origin "$BRANCH"

          gh pr create \
            --title "Generate: $PROMPT" \
            --body "Auto-generated by Claude Code from prompt: $PROMPT" \
            --base main \
            --head "$BRANCH"

  review:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Restore previous findings
        uses: actions/cache/restore@v4
        with:
          path: previous-findings.json
          key: review-findings-${{ github.event.pull_request.number }}-${{ github.run_id }}
          restore-keys: |
            review-findings-${{ github.event.pull_request.number }}-

      - name: Run PR review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          SCHEMA='{
            "type": "object",
            "properties": {
              "findings": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "file": { "type": "string" },
                    "line": { "type": "integer" },
                    "severity": { "type": "string", "enum": ["low", "medium", "high", "critical"] },
                    "message": { "type": "string" }
                  },
                  "required": ["file", "line", "severity", "message"]
                }
              }
            },
            "required": ["findings"]
          }'

          PREV=$(cat previous-findings.json 2>/dev/null || echo '{"findings":[]}')

          git diff origin/${{ github.base_ref }}...HEAD | \
            claude -p "Review this diff for bugs, security issues, and style problems.
          Previously reported findings: $PREV
          Only report issues that are new or still unresolved in the current diff — do not repeat anything already fixed." \
            --output-format json \
            --json-schema "$SCHEMA" \
            > review-output.json

          if jq -e '.structured_output.findings' review-output.json > /dev/null 2>&1; then
            jq '.structured_output' review-output.json > findings.json
          else
            echo "No structured_output in review result — falling back to empty findings." >&2
            echo '{"findings":[]}' > findings.json
          fi

          cp findings.json previous-findings.json
          cat findings.json

      - name: Save findings for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: previous-findings.json
          key: review-findings-${{ github.event.pull_request.number }}-${{ github.run_id }}

      - name: Post inline PR comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_SHA="${{ github.event.pull_request.head.sha }}"
          REPO="${{ github.repository }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          # Schema severities (low/medium/high/critical) -> CLAUDE.md tiers (Minor/Major/Critical)
          map_tier() {
            case "$1" in
              critical) echo "Critical" ;;
              high|medium) echo "Major" ;;
              low) echo "Minor" ;;
              *) echo "$1" ;;
            esac
          }

          jq -c '.findings[]' findings.json | while read -r finding; do
            FILE=$(echo "$finding" | jq -r '.file')
            LINE=$(echo "$finding" | jq -r '.line')
            SEVERITY=$(echo "$finding" | jq -r '.severity')
            MESSAGE=$(echo "$finding" | jq -r '.message')
            TIER=$(map_tier "$SEVERITY")

            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "repos/$REPO/pulls/$PR_NUMBER/comments" \
              -f body="**[$TIER]** $MESSAGE" \
              -f commit_id="$COMMIT_SHA" \
              -f path="$FILE" \
              -F line="$LINE" \
              -f side="RIGHT" \
              || echo "Failed to post comment for $FILE:$LINE"
          done
